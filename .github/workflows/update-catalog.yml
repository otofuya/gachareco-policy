name: Update Public Factual Catalog
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: public-factual-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate and refresh factual data
        run: |
          set -e
          python scripts/test_factual_catalog.py
          python scripts/scrape_catalog.py --detail-limit 200
      - name: Publish only a validated catalog
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/gacha-facts.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update factual catalog'
            git push
          fi
